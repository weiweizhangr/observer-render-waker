name: Keep Observer Render awake

on:
  schedule:
    # Exact market-day wake-up in Indian Standard Time.
    - cron: "0 9 * * 1-5"
      timezone: "Asia/Kolkata"
    # Redundant off-peak pings from 09:02 through 15:57 IST.
    - cron: "2-59/5 9-15 * * 1-5"
      timezone: "Asia/Kolkata"
    # Final ping after the bot's 16:00 IST internal shutdown.
    - cron: "2 16 * * 1-5"
      timezone: "Asia/Kolkata"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observer-render-keep-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEALTH_URL: https://observer-paper-bot.onrender.com/api/health
      MARKET_HOLIDAYS_IST: ${{ vars.MARKET_HOLIDAYS_IST || '2026-01-26,2026-03-03,2026-03-26,2026-03-31,2026-04-03,2026-04-14,2026-05-01,2026-05-28,2026-06-26,2026-09-14,2026-10-02,2026-10-20,2026-11-10,2026-11-24,2026-12-25' }}
    steps:
      - name: Skip NSE F&O holidays
        id: market-day
        shell: bash
        run: |
          today_ist="$(TZ=Asia/Kolkata date +%F)"
          if [[ ",${MARKET_HOLIDAYS_IST}," == *",${today_ist},"* ]]; then
            echo "Market holiday in IST; leaving Render asleep."
            echo "should_wake=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_wake=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wake and health-check Render
        if: steps.market-day.outputs.should_wake == 'true'
        shell: bash
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --output /dev/null \
            "$HEALTH_URL"
